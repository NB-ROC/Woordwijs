<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Woordwijs Oefening</title>
    <script type="module" crossorigin src="./assets/popup-CBPq95gc.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/login-CwxzNxDc.js">
    <link rel="stylesheet" crossorigin href="./assets/popup-Jqc74BYY.css">
  </head>
  <body>
    <header class="kop">
      <img id="logo" class="logo" alt="ROC Nijmegen" />
      <h1>Woordwijs</h1>
    </header>

    <section id="loginView">
      <form class="kaart login" id="loginForm">
        <div class="login__kop">
          <h2 class="login__titel">Welkom bij Woordwijs</h2>
          <p class="login__sub">Log in met je ROC-account</p>
        </div>
        <label class="veld">
          <span>Email</span>
          <input type="email" id="email" autocomplete="username" placeholder="naam@roc-nijmegen.nl" required />
        </label>
        <label class="veld">
          <span>Wachtwoord</span>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <p class="fout" id="loginFout" hidden></p>
        <button id="inlogBtn" class="primair" type="submit">Inloggen</button>
      </form>
    </section>

    <section id="menuView" hidden>
      <div class="kaarten">
        <div class="kaart">
          <div class="kaart__kop">Streak</div>
          <div class="waarde" id="streak">0 dagen</div>
        </div>
        <div class="kaart">
          <div class="kaart__kop">Coins</div>
          <div class="waarde" id="coins">0</div>
        </div>
      </div>

      <button id="oefenNu" class="primair" type="button">Oefen nu</button>

      <label class="veld">
        <span>Hoe vaak een pop-up?</span>
        <select id="interval">
          <option value="10">Elke 10 minuten (test)</option>
          <option value="30">Elke 30 minuten</option>
          <option value="60">Elk uur</option>
          <option value="120">Elke 2 uur</option>
          <option value="480">Elke 8 uur</option>
          <option value="1440">1x per dag</option>
        </select>
      </label>

      <div class="geschiedenis">
        <div class="label">Laatste antwoorden</div>
        <ul id="lijst"></ul>
      </div>

      <button id="uitlogBtn" class="uitloggen" type="button">Uitloggen</button>
    </section>

  </body>
</html>
